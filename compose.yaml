services:
  digest:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_BASE_URL: http://model-runner.docker.internal/engines/v1
      NEWSLETTER_RUN_ID: ${NEWSLETTER_RUN_ID:-}
    volumes:
      - ./config:/app/config:ro
      - ./state:/app/state
    models:
      llm:
        endpoint_var: LLM_URL
        model_var: LLM_MODEL

models:
  llm:
    model: huggingface.co/bartowski/qwen2.5-14b-instruct-gguf:latest
    context_size: 8192
