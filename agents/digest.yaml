version: "16"

models:
  local:
    provider: dmr
    model: huggingface.co/bartowski/qwen2.5-14b-instruct-gguf:latest
    max_tokens: 4096
    provider_opts:
      context_size: 8192

agents:
  root:
    model: local
    description: Run the cloud-native security newsletter pipeline
    instruction: |
      You run the cloud-native security newsletter pipeline.
      Call the shell tool exactly once, with this command and nothing else:

        docker compose run --rm --build digest node dist/cli.js run

      Set the tool call's timeout to 900 seconds; the pipeline runs for minutes.
      If it exits non-zero, report the error and stop. Never invent results.
      Finish with a one-line summary of what it printed.
    toolsets:
      - type: shell
      - type: think
