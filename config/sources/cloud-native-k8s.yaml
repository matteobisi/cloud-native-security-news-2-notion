category: cloud-native-k8s
description: "Kubernetes, container runtimes, networking, service mesh security"
priority: CRITICAL

sources:
  # Kubernetes Core
  - name: Kubernetes
    url: https://github.com/kubernetes/kubernetes/releases
    type: github_release
    notes: "Core K8s releases and security patches"

  - name: Kubernetes CVE feed
    url: https://kubernetes.io/docs/reference/issues-security/official-cve-feed/index.json
    type: json_feed
    notes: "Official Kubernetes CVE feed (JSON Feed)"

  - name: Kubernetes blog
    url: https://kubernetes.io/feed.xml
    type: rss
    priority: MEDIUM

  - name: CNCF blog
    url: https://www.cncf.io/blog/feed/
    type: rss
    priority: MEDIUM

  # Container Runtime
  - name: runc
    url: https://github.com/opencontainers/runc/releases
    type: github_release

  - name: crun
    url: https://github.com/containers/crun/releases
    type: github_release
    priority: HIGH

  - name: gVisor
    url: https://github.com/google/gvisor/releases
